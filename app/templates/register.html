{% extends "base.html" %}
{% block title %}Register - TrustVault{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Register</h1>
  {% if error %}<p class="msg error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name <input name="name" required maxlength="100"></label>
    <label>Email <input name="email" type="email" required maxlength="254" autocomplete="username"></label>
    <label>Password (10+ characters) <input name="password" type="password" required minlength="10" autocomplete="new-password"></label>
    <button type="submit">Create account</button>
  </form>
  <p class="msg info">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
</section>
{% endblock %}
