<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <title>{% block title %}TrustVault{% endblock %}</title>
</head>
<body>
<header class="bar">
  <a class="brand" href="{{ url_for('ui.documents_page') }}">TrustVault</a>
  {% if user %}
  <nav>
    <a href="{{ url_for('ui.documents_page') }}">Documents</a>
    {% if show_upload %}<a href="{{ url_for('ui.upload_page') }}">Upload</a>{% endif %}
    {% if show_admin %}<a href="{{ url_for('ui.admin_page') }}">Activity</a>{% endif %}
  </nav>
  <form method="post" action="{{ url_for('auth.logout') }}" class="logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <span class="who">{{ user.name }} ({{ user.role }})</span>
    <button class="link">Log out</button>
  </form>
  {% endif %}
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
